<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leonardo Colours</title>

  <link rel="stylesheet" href="core/reset.css">
  <link rel="stylesheet" href="core/tokens.css">
  <link rel="stylesheet" href="core/base.css">
  <link rel="stylesheet" href="utilities/colours.css">
  <link rel="stylesheet" href="utilities/spacing.css">
  <link rel="stylesheet" href="utilities/layout.css">
  <link rel="stylesheet" href="utilities/typography-utils.css">
</head>

<body class="bg-page p-6">

  <h1 class="text-main text-3xl font-display mb-4">Leonardo Colour System</h1>

  <div class="stack-md">

    <!-- Brand Colours -->
    <section>
      <h2 class="text-strong text-xl mb-2">Brand Colours</h2>
      <div class="cluster">
        <div class="p-4 bg-main text-elevated" style="border-radius: var(--leo-radius-md);">--leo-colour-main</div>
        <div class="p-4 bg-main-soft" style="border-radius: var(--leo-radius-md);">--leo-colour-main-soft</div>
        <div class="p-4 bg-main-strong" style="border-radius: var(--leo-radius-md);">--leo-colour-main-strong</div>
      </div>
    </section>

    <!-- Accent Colours -->
    <section>
      <h2 class="text-strong text-xl mb-2">Accent Colours</h2>
      <div class="cluster">
        <div class="p-4 bg-accent" style="border-radius: var(--leo-radius-md);">--leo-colour-accent</div>
        <div class="p-4 bg-accent-soft" style="border-radius: var(--leo-radius-md);">--leo-colour-accent-soft</div>
        <div class="p-4 bg-accent-strong" style="border-radius: var(--leo-radius-md);">--leo-colour-accent-strong</div>
      </div>
    </section>

    <!-- Semantic Colours -->
    <section>
      <h2 class="text-strong text-xl mb-2">Semantic Colours</h2>
      <div class="cluster">
        <div class="p-4 text-elevated"
          style="background: var(--leo-colour-success); border-radius: var(--leo-radius-md);">Success</div>
        <div class="p-4 text-elevated"
          style="background: var(--leo-colour-warning); border-radius: var(--leo-radius-md);">Warning</div>
        <div class="p-4 text-elevated"
          style="background: var(--leo-colour-danger); border-radius: var(--leo-radius-md);">Danger</div>
        <div class="p-4 text-elevated" style="background: var(--leo-colour-info); border-radius: var(--leo-radius-md);">
          Info</div>
      </div>
    </section>

    <!-- Neutral Colours -->
    <section>
      <h2 class="text-strong text-xl mb-2">Neutral Palette</h2>
      <div class="cluster">
        <div class="p-4 bg-page border" style="border-radius: var(--leo-radius-md);">Page</div>
        <div class="p-4 bg-surface border" style="border-radius: var(--leo-radius-md);">Surface</div>
        <div class="p-4 bg-elevated border" style="border-radius: var(--leo-radius-md);">Elevated</div>
      </div>
    </section>

  </div>

</body>

</html>
