<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leonardo Buttons</title>
  <link rel="icon" href="./images/TheFavicon.png">
  <link rel="stylesheet" href="core/reset.css">
  <link rel="stylesheet" href="core/tokens.css">
  <link rel="stylesheet" href="core/base.css">
  <link rel="stylesheet" href="utilities/spacing.css">
  <link rel="stylesheet" href="utilities/layout.css">
  <link rel="stylesheet" href="utilities/typography-utils.css">
  <link rel="stylesheet" href="components/buttons.css">
</head>

<body class="bg-page p-6">

  <h1 class="text-main text-3xl font-display mb-6">Leonardo Buttons</h1>

  <div class="stack-lg">

    <!-- Main -->
    <section>
      <h2 class="text-strong text-xl mb-2">Primary Buttons</h2>
      <div class="cluster">
        <button class="btn btn-main">Main</button>
        <button class="btn btn-main btn-sm">Small</button>
        <button class="btn btn-main btn-lg">Large</button>
        <button class="btn btn-main btn-pill">Pill</button>
      </div>
    </section>

    <!-- Accent -->
    <section>
      <h2 class="text-strong text-xl mb-2">Accent Buttons</h2>
      <div class="cluster">
        <button class="btn btn-accent">Accent</button>
        <button class="btn btn-accent btn-pill">Pill</button>
      </div>
    </section>

    <!-- Soft -->
    <section>
      <h2 class="text-strong text-xl mb-2">Soft Buttons</h2>
      <div class="cluster">
        <button class="btn btn-soft">Soft</button>
        <button class="btn btn-soft btn-pill">Pill</button>
      </div>
    </section>

    <!-- Outline -->
    <section>
      <h2 class="text-strong text-xl mb-2">Outline Buttons</h2>
      <div class="cluster">
        <button class="btn btn-outline">Outline</button>
        <button class="btn btn-outline btn-pill">Pill</button>
      </div>
    </section>

    <!-- Ghost -->
    <section>
      <h2 class="text-strong text-xl mb-2">Ghost Buttons</h2>
      <div class="cluster">
        <button class="btn btn-ghost">Ghost</button>
        <button class="btn btn-ghost btn-pill">Pill</button>
      </div>
    </section>

    <!-- Block -->
    <section>
      <h2 class="text-strong text-xl mb-2">Block Button</h2>
      <button class="btn btn-main btn-block">Full Width Button</button>
    </section>

  </div>

</body>

</html>
